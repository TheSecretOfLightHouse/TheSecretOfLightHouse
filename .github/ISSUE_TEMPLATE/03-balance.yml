name: 밸런스
description: 수치 조정 제안
title: "[밸런스] "
body:
  - type: input
    id: target
    attributes:
      label: 대상
      placeholder: 배 무전 지속 시간 / 이동 속도 / 상호작용 거리
    validations:
      required: true

  - type: input
    id: current
    attributes:
      label: 현재 값
    validations:
      required: true

  - type: input
    id: proposed
    attributes:
      label: 제안 값
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 근거
      description: 플레이 테스트에서 관찰한 것을 구체적으로
      placeholder: "예: 배 무전 1회 5초 가안으로 구조 요청을 전달하기 어려웠다면 실제 플레이 테스트 상황과 관찰 결과를 기록"
    validations:
      required: true

  - type: checkboxes
    id: side
    attributes:
      label: 영향 확인
      options:
        - label: 이 변경이 다른 수치에 미치는 영향을 검토했다
