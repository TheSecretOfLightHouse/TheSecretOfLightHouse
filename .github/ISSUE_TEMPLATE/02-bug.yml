name: 버그
description: 동작하지 않는 것
title: "[버그] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 치명 — 진행 불가 / 크래시
        - 높음 — 핵심 기능 오동작
        - 보통 — 우회 가능
        - 낮음 — 시각적 문제
    validations:
      required: true

  - type: checkboxes
    id: network
    attributes:
      label: 네트워크 관련
      options:
        - label: 서버에서만 발생
        - label: 클라이언트에서만 발생
        - label: 양쪽 모두 발생
        - label: 단일 플레이에서도 발생

  - type: textarea
    id: repro
    attributes:
      label: 재현 순서
      placeholder: |
        1. 두 명으로 접속
        2. 같은 아이템에 동시에 다가가 줍기
        3. 두 명 모두 아이템을 받음
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 콘솔 로그
      render: text
