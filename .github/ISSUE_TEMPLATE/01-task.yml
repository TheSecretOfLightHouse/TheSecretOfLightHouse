name: 작업
description: 개발 작업 항목
title: "[작업] "
body:
  - type: dropdown
    id: part
    attributes:
      label: 담당 파트
      description: 기능 담당자가 해당 서버·클라이언트·동기화를 함께 맡습니다.
      options:
        - World — 강민서 (ri-ver-1)
        - Network · Interaction · Lighthouse — 김지훈 (zhun0922)
        - Player — 최명기 (cmg6991)
        - Monsters · Mafia — 박태욱 (awe46566)
        - 시스템&UI — 최명기 (cmg6991)
        - AX 문서 · 작업 자동화 — 김민성 (AidenKim923)
        - 복수 파트 — 본문에 각 담당과 경계 기재
    validations:
      required: true
  # 마일스톤 일정이 정해지면 dropdown으로 바꾼다
  - type: input
    id: milestone
    attributes:
      label: 마일스톤
      placeholder: (미정)

  - type: textarea
    id: what
    attributes:
      label: 무엇을 만드나
      placeholder: 바닥에 떨어진 아이템을 서버가 판정해 한 명에게만 지급
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있는지 구체적으로
      placeholder: |
        - 두 명이 동시에 주워도 한 명만 받는다
        - 서버 인벤토리와 소유 클라이언트의 표시가 일치하고 허용된 정보만 전달한다
        - 다인 접속(M2 이상)에서 확인했다
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 참고 문서
      placeholder: docs/unity/NETWORK_AUTHORITY.md
